plugins { id 'java' }
version = '1.6.0'
group = 'org.openstreetmap.josm.plugins.linesplitter'
repositories { mavenCentral() }
dependencies {
    compileOnly files('../cache/josm-tested.jar')
}
java { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('src/main/resources') { include 'data/*.lang'; include 'images/**/*' }
}
jar {
    manifest {
        attributes(
            'Plugin-Name': 'line-splitter',
            'Plugin-Class': 'org.openstreetmap.josm.plugins.linesplitter.LineSplitterPlugin',
            'Plugin-Version': version,
            'Plugin-Date': new Date().format('yyyy-MM-dd'),
            'Plugin-Description': 'Split lines into segments with limited points',
            'ru_Plugin-Description': 'Разбиение линий на сегменты с ограничением количества точек',
            'Plugin-Link': 'https://wiki.openstreetmap.org/wiki/JOSM/Plugins/LineSplitter',
            'Plugin-Author': 'JOSM Plugin Builder',
            'Plugin-License': 'GPL v3+',
            'Plugin-Mainversion': '19000',
            'Plugin-Canloadatruntime': 'true',
            'Plugin-Localizations': 'ar,ast,be,bg,ca,ca-valencia,cs,cy,da,de,el,en,en_AU,en_CA,en_GB,eo,es,et,fa,fi,fo,fr,gl,hu,id,is,it,ja,km,ko,lo,lt,lv,mr,nb,nl,nn,pl,pt,pt_BR,ru,sk,sr-latin,sv,tr,zh_CN,zh_TW',
            'Plugin-Icon': 'images/line-splitter.svg'
        )
    }
    from(projectDir) {
        include 'LICENSE'
        include 'README.md'
        include 'README_RU.md'
    }
}
